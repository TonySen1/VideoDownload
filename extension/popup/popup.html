<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>VideoDownload 助手</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- 头部：品牌标识 + 连接状态胶囊 -->
  <header class="status" id="status">
    <img class="logo" src="../icons/icon128.png" alt="VideoDownload">
    <div class="head-main">
      <div class="brand-row">
        <span class="brand-name">VideoDownload</span>
        <span class="chip"><i class="chip-dot"></i><span id="statusTitle">检测中</span></span>
      </div>
      <div class="head-sub" id="statusSub">正在检测软件连接…</div>
    </div>
  </header>

  <!-- 主操作：渐变大按钮 -->
  <button class="hero" id="send-btn">
    <span class="hero-ico">
      <svg viewBox="0 0 16 16" width="17" height="17" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 2v7.5"/><path d="M4.5 6.5 8 10l3.5-3.5"/><path d="M2.5 13.5h11"/>
      </svg>
    </span>
    <span class="hero-text">
      <span class="hero-title" id="sendLabel">解析当前视频</span>
      <span class="hero-sub">发送链接到 VideoDownload · 选画质即可下载</span>
    </span>
  </button>

  <!-- 当前页面 -->
  <section class="card">
    <div class="card-head">
      <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="3" width="12" height="10" rx="2"/>
        <path d="M2 7.5h12"/>
      </svg>
      当前页面
      <span class="head-tip" id="version">v—</span>
    </div>
    <div class="row">
      <div class="row-main">
        <div class="page-title" id="page-title">—</div>
        <div class="row-sub" id="page-host">—</div>
      </div>
    </div>
  </section>

  <!-- 登录 cookie -->
  <section class="card">
    <div class="card-head">
      <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="8" cy="8" r="6"/>
        <circle cx="6.1" cy="6.3" r=".9" fill="currentColor" stroke="none"/>
        <circle cx="9.9" cy="8.4" r=".9" fill="currentColor" stroke="none"/>
        <circle cx="6.6" cy="10" r=".9" fill="currentColor" stroke="none"/>
      </svg>
      Cookie
      <span class="head-tip">仅在本机传输</span>
    </div>
    <div class="row">
      <div class="row-main">
        <div class="row-title">同步登录 cookie 到程序</div>
        <div class="row-sub" id="cookieState">遇到年龄限制或需要登录的视频时点同步，程序将改用它解析</div>
      </div>
      <button class="text-btn" id="cookies-btn">同步</button>
    </div>
  </section>

  <!-- 外观：主题三档 + 悬浮标记形态 -->
  <section class="card">
    <div class="card-head">
      <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="8" cy="8" r="5.5"/>
        <path d="M8 2.5a5.5 5.5 0 0 1 0 11Z" fill="currentColor" stroke="none"/>
      </svg>
      外观
      <div class="theme-seg" id="themeSeg" role="group" aria-label="界面主题">
        <button data-pref="light" title="浅色主题">浅色</button>
        <button data-pref="dark" title="深色主题">深色</button>
        <button data-pref="auto" title="跟随浏览器深浅色">跟随</button>
      </div>
    </div>
    <button class="row row-btn" id="styleToggle" aria-expanded="false">
      <span class="row-main">
        <span class="row-title">标记形态</span>
        <span class="row-sub">页面悬浮标记的外观模板，点击卡片即时换装</span>
      </span>
      <span class="d-value" id="styleValue">—</span>
      <svg class="chev" viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m6 4 4 4-4 4"/>
      </svg>
    </button>
    <div class="style-grid" id="styleGrid"></div>
  </section>

  <!-- 位置记忆 -->
  <section class="card">
    <div class="card-head">
      <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 14.5S3.5 10.6 3.5 7a4.5 4.5 0 0 1 9 0c0 3.6-4.5 7.5-4.5 7.5Z"/>
        <circle cx="8" cy="7" r="1.8"/>
      </svg>
      位置记忆
      <span class="head-tip">拖动后的位置按站点记住</span>
    </div>
    <div class="row">
      <div class="row-main">
        <div class="row-title">本站位置</div>
        <div class="row-sub" id="siteState">…</div>
      </div>
      <button class="text-btn" id="clearSiteBtn" disabled>清除</button>
    </div>
    <button class="danger-row" id="clearAllBtn">
      <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 4.5h10"/>
        <path d="M6.5 4.5V3.4a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v1.1"/>
        <path d="M4.7 4.5h6.6l-.6 7.5a1.3 1.3 0 0 1-1.3 1.2H6.6a1.3 1.3 0 0 1-1.3-1.2L4.7 4.5Z"/>
      </svg>
      <span id="clearAllLabel">清除所有站点的位置记忆</span>
    </button>
  </section>

  <p class="result" id="result"></p>

  <footer>悬浮标记 <b id="pillState">—</b> · 桥接端口 <b id="port">未连接</b></footer>

  <script src="popup.js" type="module"></script>
</body>
</html>
